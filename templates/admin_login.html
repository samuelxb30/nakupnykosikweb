
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin prihlásenie</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0f14;
            --panel: #111720;
            --panel-light: #161e29;
            --border: #263241;
            --text: #f3f6fa;
            --muted: #8b98a8;
            --primary: #5eead4;
            --primary-dark: #2dd4bf;
            --danger: #fb7185;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            font-size: 23px;
            font-weight: bold;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--primary);
            color: #071412;
            font-size: 23px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .panel-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .panel-header h1 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .panel-header p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .form {
            padding: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: var(--panel-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        input::placeholder {
            color: #687587;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #071412;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .error-message {
            padding: 12px;
            margin-bottom: 18px;
            background: #351923;
            border: 1px solid #713044;
            border-radius: 8px;
            color: var(--danger);
            font-size: 13px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: var(--muted);
            text-decoration: none;
            text-align: center;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">
            <div class="logo-icon">🥬</div>
            Naše potraviny
        </div>

        <section class="panel">

            <header class="panel-header">
                <h1>🔐 Admin prihlásenie</h1>
                <p>
                    Prihláste sa heslom pre prístup
                    do administračnej časti obchodu.
                </p>
            </header>

            <form
                class="form"
                action="/admin/login"
                method="post"
            >

                {% if error %}
                    <div class="error-message" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                <label for="password">
                    Administrátorské heslo
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Zadajte svoje heslo"
                    autocomplete="current-password"
                    required
                    autofocus
                >

                <button type="submit">
                    Prihlásiť sa →
                </button>

            </form>

        </section>

        <a href="/" class="back-link">
            ← Späť do nákupného košíka
        </a>

        <div class="footer">
            © 2026 Naše potraviny
        </div>

    </main>

</body>
</html>
